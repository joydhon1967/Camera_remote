<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Remote Camera</title>
<meta name="theme-color" content="#14181c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: single phone-width column. Remote view = link card, live stage, filter strip, mode toggle, shutter row, gallery. Camera view = permission card, small preview, status card. */
  :root {
    --bg: #eef1f3;
    --surface: #ffffff;
    --surface-2: #e3e8eb;
    --fg: #15191d;
    --muted: #5a666f;
    --line: #cfd6db;
    --accent: #d9411e;
    --accent-fg: #ffffff;
    --ok: #1b8a5a;
    --warn: #b7791f;
    --font: "Hind Siliguri", "Noto Sans Devanagari", "Noto Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101417; --surface: #1a2025; --surface-2: #252d33; --fg: #eaeff2; --muted: #93a1ab;
      --line: #2f3940; --accent: #ff5a36; --accent-fg: #1a0a05; --ok: #3ecf8e; --warn: #f0b24a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101417; --surface: #1a2025; --surface-2: #252d33; --fg: #eaeff2; --muted: #93a1ab;
    --line: #2f3940; --accent: #ff5a36; --accent-fg: #1a0a05; --ok: #3ecf8e; --warn: #f0b24a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.55;
    padding-block: max(14px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .langbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .langbar label { font-size: .9rem; color: var(--muted); }
  select {
    font: inherit; font-size: .95rem; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; min-height: 40px; max-width: 60%;
  }
  select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 700; text-wrap: balance; }
  h2 { font-size: 1rem; margin: 0 0 4px; font-weight: 600; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: .9rem; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); font-size: .85rem;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: none; }
  .pill[data-s="ok"] .dot { background: var(--ok); }
  .pill[data-s="bad"] .dot { background: var(--accent); }
  .pill[data-s="rec"] .dot { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .linkbox {
    width: 100%; font: inherit; font-size: .85rem; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--fg); direction: ltr; text-align: left;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1 1 110px; }
  button, .btn {
    font: inherit; font-weight: 600; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--fg); cursor: pointer; text-align: center; text-decoration: none; min-height: 44px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  button:focus-visible, .btn:focus-visible, .linkbox:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .stage {
    position: relative; background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 3 / 4; width: 100%; max-height: 62vh;
    display: grid; place-items: center; margin-inline: auto;
  }
  .stage video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .stage .msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #cdd6dc; font-size: .95rem; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s ease-out; }
  .flash.on { opacity: .9; transition: none; }
  .count { position: absolute; inset: 0; display: grid; place-items: center; font-size: 6rem; font-weight: 700; color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.6); pointer-events: none; }
  .rec {
    position: absolute; top: 10px; inset-inline-start: 10px; display: inline-flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,.6); color: #fff; padding: 4px 12px; border-radius: 999px; font-size: .85rem; font-variant-numeric: tabular-nums;
  }
  .rec .rdot { width: 10px; height: 10px; border-radius: 50%; background: #ff3b30; animation: pulse 1s infinite; }
  .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .chip { flex: none; min-height: 38px; padding: 6px 14px; border-radius: 999px; font-weight: 500; font-size: .9rem; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .seg { display: flex; justify-content: center; }
  .seg .inner { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; min-height: 38px; padding: 4px 22px; border-radius: 999px; }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .controls .side { display: flex; }
  .controls .side.end { justify-content: flex-end; }
  .shutter { position: relative; width: 76px; height: 76px; border-radius: 50%; padding: 0; border: 4px solid var(--fg); background: transparent; min-height: 0; }
  .shutter::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--fg); transition: inset .15s, border-radius .15s, background .15s; }
  .shutter.vid::after { background: var(--accent); }
  .shutter.on::after { inset: 20px; border-radius: 8px; background: var(--accent); }
  .shutter:active { transform: scale(.94); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; padding: 0; border: 1px solid var(--line); background: var(--surface-2); min-height: 0; display: block; }
  .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .thumb .play {
    position: absolute; inset-inline-end: 6px; bottom: 6px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.65);
  }
  .thumb .play::after { content: ""; position: absolute; inset: 7px 7px 7px 10px; border-style: solid; border-width: 6px 0 6px 10px; border-color: transparent transparent transparent #fff; }
  .viewer { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.94); display: flex; flex-direction: column; gap: 10px;
    padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
  .viewer img, .viewer video { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #000; }
  .viewer .row button { background: #2a3238; color: #eef3f6; border-color: #3a444b; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom, 0px)); z-index: 30;
    background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .9rem; max-width: 90vw; text-align: center;
  }
  .note { border-inline-start: 3px solid var(--warn); padding: 6px 10px; background: var(--surface-2); border-radius: 8px; font-size: .9rem; }
  @media (prefers-reduced-motion: reduce) { .flash, .shutter::after { transition: none; } .pill[data-s="rec"] .dot, .rec .rdot { animation: none; } }
</style>
</head>
<body>
<div class="wrap">

  <div class="langbar">
    <label for="langSel" data-k="lang">Language</label>
    <select id="langSel"></select>
  </div>

  <!-- ====== Remote phone: photos and videos are collected here ====== -->
  <section id="remoteView" hidden>
    <div class="wrap">
      <header>
        <h1 data-k="app_remote">Remote Camera</h1>
        <span class="pill" id="rStatus" data-s="wait"><span class="dot"></span><span id="rStatusText"></span></span>
      </header>

      <div class="card" id="linkCard">
        <div>
          <h2 data-k="link_h"></h2>
          <p class="muted" data-k="link_p"></p>
        </div>
        <input class="linkbox" id="linkBox" readonly value="" aria-label="Link">
        <div class="row">
          <button class="primary" id="shareBtn" type="button" data-k="share"></button>
          <button id="copyBtn" type="button" data-k="copy"></button>
          <a class="btn" id="waBtn" href="#" target="_blank" rel="noopener">WhatsApp</a>
        </div>
        <p class="note" id="fileWarn" data-k="file_warn" hidden></p>
      </div>

      <div class="stage" id="rStage">
        <video id="rVideo" playsinline autoplay muted></video>
        <div class="msg" id="rMsg"></div>
        <div class="flash" id="rFlash"></div>
        <div class="count" id="rCount" hidden></div>
        <div class="rec" id="rRec" hidden><span class="rdot"></span><span id="rTime">00:00</span></div>
      </div>
      <p class="muted" id="rxInfo" hidden></p>

      <div class="filters" id="filters" role="group"></div>

      <div class="seg">
        <div class="inner" role="group">
          <button type="button" id="modePhoto" aria-pressed="true" data-k="mode_photo"></button>
          <button type="button" id="modeVideo" aria-pressed="false" data-k="mode_video"></button>
        </div>
      </div>

      <div class="controls">
        <div class="side"><button id="flipBtn" type="button" data-k="flip" disabled></button></div>
        <button class="shutter" id="shotBtn" type="button" disabled></button>
        <div class="side end"><button id="timerBtn" type="button"></button></div>
      </div>

      <div class="card">
        <h2><span data-k="gal_h"></span> <span id="photoCount" class="muted"></span></h2>
        <div class="grid" id="grid"></div>
        <p class="muted" id="emptyGal" data-k="gal_empty"></p>
      </div>
    </div>
  </section>

  <!-- ====== Camera phone ====== -->
  <section id="cameraView" hidden>
    <div class="wrap">
      <header>
        <h1 data-k="app_camera">Camera Phone</h1>
        <span class="pill" id="cStatus" data-s="wait"><span class="dot"></span><span id="cStatusText"></span></span>
      </header>

      <div class="card" id="startCard">
        <div>
          <h2 data-k="c_start_h"></h2>
          <p class="muted" data-k="c_start_p"></p>
        </div>
        <button class="primary" id="startBtn" type="button" data-k="c_start_btn"></button>
        <p class="note" id="camErr" hidden></p>
      </div>

      <div class="stage" id="cStage" hidden>
        <video id="cVideo" playsinline autoplay muted></video>
        <div class="flash" id="cFlash"></div>
      </div>

      <div class="card" id="liveCard" hidden>
        <p id="liveText"></p>
        <p class="muted" data-k="c_note"></p>
        <p class="muted" id="sentCount"></p>
      </div>
    </div>
  </section>
</div>

<div class="viewer" id="viewer" hidden>
  <img id="viewImg" alt="">
  <video id="viewVid" controls playsinline hidden></video>
  <div class="row">
    <button id="vSave" type="button" data-k="save"></button>
    <button id="vShare" type="button" data-k="share"></button>
    <button id="vDel" type="button" data-k="del"></button>
    <button id="vClose" type="button" data-k="close"></button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    }

    // ---------- video ----------
    function pickMime() {
      var list = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
      for (var i = 0; i < list.length; i++) { try { if (MediaRecorder.isTypeSupported(list[i])) return list[i]; } catch (e) {} }
      return "";
    }
    function startRec(id) {
      if (isRec) return;
      if (!window.MediaRecorder || !stream) { notify({ t: "err", k: "no_rec" }); return; }
      try {
        var tracks = stream.getVideoTracks().slice();
        if (mic && mic.readyState === "live") tracks.push(mic);
        var mime = pickMime();
        rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType: mime, videoBitsPerSecond: 6000000 } : { videoBitsPerSecond: 6000000 });
        recChunks = []; recId = id;
        rec.ondataavailable = function (e) { if (e.data && e.data.size) recChunks.push(e.data); };
        rec.onstop = function () {
          clearTimeout(recTimeout); isRec = false;
          var type = (rec.mimeType || mime || "video/webm").split(";")[0];
          var blob = new Blob(recChunks, { type: type }); recChunks = [];
          setPill("c", "wait", "s_send"); setLive("c_send");
          notify({ t: "rec", on: false });
          enqueue({ kind: "video", id: recId, blob: blob });
        };
        rec.onerror = function () { notify({ t: "err", k: "e_rec" }); };
        rec.start(1000);
        isRec = true;
        setPill("c", "rec", "s_rec"); setLive("c_rec");
        notify({ t: "rec", on: true });
        recTimeout = setTimeout(stopRec, 5 * 60 * 1000);
      } catch (e) { isRec = false; notify({ t: "err", k: "e_rec" }); }
    }
    function stopRec() { clearTimeout(recTimeout); if (rec && rec.state !== "inactive") { try { rec.stop(); } catch (e) {} } }

    // ---------- sending (photos and videos share one chunked transfer) ----------
    function enqueue(item) { outQueue = outQueue.then(function () { return transfer(item); }).catch(function () {}); }
    function untilOpen() { return new Promise(function (res) { (function chk() { if (conn && conn.open) res(); else setTimeout(chk, 500); })(); }); }
    async function sendOnce(item) {
      var c = conn, size = item.blob.size, CH = 65536;
      if (!c || !c.open) throw { drop: 1 };
      c.send({ t: "fs", id: item.id, kind: item.kind, type: item.blob.type || (item.kind === "video" ? "video/mp4" : "image/jpeg"), size: size });
      for (var off = 0; off < size; off += CH) {
        var buf = await item.blob.slice(off, off + CH).arrayBuffer();
        while (c.open && c.dataChannel && c.dataChannel.bufferedAmount > 1048576) await sleep(40);
        if (!c.open || c !== conn) throw { drop: 1 };
        c.send({ t: "fc", id: item.id, buf: buf });
      }
      c.send({ t: "fe", id: item.id });
    }
    async function transfer(item) {
      for (;;) {
        await untilOpen();
        try { await sendOnce(item); break; } catch (e) { if (e && e.drop) continue; break; }
      }
      sent++; setT($("sentCount"), "c_sent", { n: sent });
      if (!isRec) { setPill("c", "ok", "s_linked"); setLive("c_live_ok"); }
    }

    langHooks.push(function () { /* dynamic texts are re-rendered by data-k */ });
    setPill("c", "wait", "c_status_wait");
    applyLang();
  }

  /* ---------- start ---------- */
  initLang();
  if (joinId) initCamera(); else initRemote();
  applyLang();
})();
</script>
